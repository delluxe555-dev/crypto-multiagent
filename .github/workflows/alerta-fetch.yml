name: AlertaChart Fetcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: Fetch from AlertaChart and upload to Railway
        env:
          ALERTACHART_SESSION: ${{ secrets.ALERTACHART_SESSION }}
          ALERTACHART_CSRF: ${{ secrets.ALERTACHART_CSRF }}
          ALERTACHART_BASE: https://www.alertachart.com
          RAILWAY_UPLOAD_URL: ${{ secrets.RAILWAY_UPLOAD_URL }}
          PAYLOAD_UPLOAD_TOKEN: ${{ secrets.PAYLOAD_UPLOAD_TOKEN }}
        run: python tools/fetcher_github.py
